spring.application.name=eureka
server.port=8761

# En tant que serveur de registre, il ne doit ni s'enregistrer auprès de lui-même, ni chercher de registre externe
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Configuration Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Eureka Server
info.app.version=1.0.0
info.app.description=Serveur d'enregistrement et de découverte de services Netflix Eureka
