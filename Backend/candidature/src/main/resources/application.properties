# Service Name & Port
spring.application.name=candidature
server.port=8085

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Informations publiees dans /actuator/info
info.app.name=candidature
info.app.version=1.0.0
info.app.description=Microservice de gestion des candidatures
info.app.team=Groupe 2 - 4DAS11

# Database Configuration (H2 par defaut, ou MySQL si active)
spring.datasource.url=jdbc:h2:mem:candidaturedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
