# Nom du Service & Port (Slide 6 & 7)
spring.application.name=ms-notifications
server.port=8085

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Metadonnees de l'application
info.app.name=ms-notifications
info.app.version=1.0.0
info.app.description=Microservice commun de notifications et rappels (Smart Campus)
info.app.responsable=Equipe Smart Campus
info.app.team=Smart Campus (Groupe 2 - 4DAS11)

# Base de données H2
spring.datasource.url=jdbc:h2:mem:notifications_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
