# Service Name & Port
spring.application.name=job
server.port=8082

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Transmettre a Eureka le statut reel de /health (Job passe DOWN si MySQL tombe)
eureka.client.healthcheck.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Informations publiees dans /actuator/info
info.app.name=Job
info.app.version=1.0.0
info.app.description=Microservice de gestion des offres
info.app.team=Groupe 2 - 4DAS11

# MySQL Database Configuration (XAMPP ou WAMP sur localhost:3306)
spring.datasource.url=jdbc:mysql://localhost:3306/job_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
