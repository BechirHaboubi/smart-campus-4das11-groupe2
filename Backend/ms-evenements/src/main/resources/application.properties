# Nom du Microservice & Port
spring.application.name=ms-evenements
server.port=8082

# Enregistrement auprès d'Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Transmission de la vraie santé à Eureka (DOWN si la base tombe)
eureka.client.healthcheck.enabled=true

# Configuration Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Metadonnees de l'application (/actuator/info)
info.app.name=ms-evenements
info.app.version=1.0.0
info.app.description=Microservice de gestion des événements et des clubs (Smart Campus)
info.app.responsable=Dhia Trabelsi
info.app.team=Groupe 2 - 4DAS11

# Configuration Base de données (MySQL par défaut, avec fallback H2 si besoin)
spring.datasource.url=jdbc:mysql://localhost:3306/campus_evenements?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
